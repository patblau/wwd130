<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Designer Portfolio</title>
    <link rel="stylesheet" href="../styles/ice.css">
    <style>
        /* Reset Defaults */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        /* Header Section */
        header {
            background: url('https://byui-wdd.github.io/wdd130/ice/w05_circles.jpg') no-repeat center center/cover;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        h1 {    
            font-size: 28px;
            font-weight: bold;
        }

        h2 {
            font-size: 18px;
        }

        /* Icons Section */
        .icons {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 20px;
            background: #444;
        }

        .icon {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #333;
        }

        .icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Top section (hero) */
        .hero {
            display: block;
            margin: 0;
            padding: 0;
            position: relative;
        }

        .hero img {
            display: block;
            width: 100%;
            height: auto;
        }

        .hero-text {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #333;
        }

        .hero-text h1 {
            font-size: 2.5em;
            margin: 0;
        }

        .hero-text h2 {
            font-weight: normal;
            margin-top: 10px;
        }

        /* Bottom circle section */
        .circles {
            background-color: #666;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            padding: 40px 0;
            margin-top: 0;
        }
        </style>
        
    </head>
<body>
    <header>
    </header>

    <section class="icons">
        <div class="icon">
            <img src="https://byui-wdd.github.io/wdd130/ice/w05_ice_image_desk.jpg" alt="Office Workspace">
        </div>
        <div class="icon">
            <img src="https://byui-wdd.github.io/wdd130/ice/w05_ice_image_graphic.png" alt="Graphic Design Logo">
        </div>
        <div class="icon">
            <img src="https://byui-wdd.github.io/wdd130/ice/w05_ice_image_person.jpg" alt="Portrait of Thomas DeSantos">
        </div>
    </section>
</body>
</html>
